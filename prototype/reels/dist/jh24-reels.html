<title>HJ-24 Reel Prototype</title>

<style>
  /* One-screen instrument: the 3D deck fills the window; a transport strip and readouts float over it. */
  :root {
    --room: #0e0c0b;        /* control-room dark */
    --panel: #6f6a63;       /* HJ-24 deck taupe */
    --panel-dk: #4c4844;
    --outline: #e6e1d8;     /* strip outline */
    --ink: #f1ece3;
    --ink-dim: #b8b1a5;
    --led: #ff3a24;
    --font-ui: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --font-num: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--room); color: var(--ink); font: 500 15px/1.35 var(--font-ui); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }

  .hud { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; pointer-events: none; }
  .counter { display: inline-flex; align-items: baseline; gap: 12px; padding: 10px 16px; background: #0a0302; border: 1px solid #2a0d08; border-radius: 6px; box-shadow: inset 0 0 18px rgba(255, 40, 20, .12); }
  .counter b { font: 700 40px/1 var(--font-num); color: var(--led); letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 58, 36, .65); font-variant-numeric: tabular-nums; }
  .counter span { font-size: 14px; color: #c9786c; letter-spacing: 1.5px; text-transform: uppercase; }
  .readouts { display: grid; grid-template-columns: auto auto; gap: 4px 18px; padding: 10px 14px; background: rgba(20, 18, 16, .78); border: 1px solid rgba(230, 225, 216, .14); border-radius: 6px; font-size: 14px; }
  .readouts dt { color: var(--ink-dim); letter-spacing: .5px; }
  .readouts dd { margin: 0; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .state { font: 700 14px var(--font-ui); letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim); }
  .state.on { color: #7ee08f; }
  .state.rec { color: #ff7a6a; }

  .strip { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 18px; padding: 12px 18px; max-width: calc(100% - 32px); box-sizing: border-box; background: linear-gradient(180deg, #7e7871, #67625c); border: 2px solid var(--outline); border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .25); }
  .group { display: flex; align-items: center; gap: 8px; }
  .group + .group { padding-left: 18px; border-left: 1px solid rgba(0, 0, 0, .3); }
  .lbl { font-size: 14px; letter-spacing: 1px; color: #f3efe6; text-transform: uppercase; }
  button.key { font: 800 15px var(--font-ui); min-width: 54px; height: 44px; padding: 0 10px; border-radius: 4px; border: 0; cursor: pointer; color: #1a1208; background: #efece4; box-shadow: 0 4px 0 #2a2624, 0 6px 10px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .7); transition: transform .05s, box-shadow .05s, filter .1s; }
  button.key:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a2624, inset 0 1px 0 rgba(255, 255, 255, .5); }
  button.key:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
  button.key.play { background: #3fc9a0; } button.key.rec { background: #e0322a; color: #fff; } button.key.lift { background: #3f7fd6; color: #fff; }
  button.key.small { min-width: 44px; height: 36px; font-size: 14px; }
  button.key[aria-pressed="true"] { filter: brightness(1.18) saturate(1.2); box-shadow: 0 1px 0 #2a2624, 0 0 16px rgba(255, 240, 200, .55), inset 0 1px 0 rgba(255, 255, 255, .6); transform: translateY(3px); }
  button.key.play[aria-pressed="true"] { box-shadow: 0 1px 0 #2a2624, 0 0 18px rgba(80, 255, 170, .8); }
  button.key.rec[aria-pressed="true"] { box-shadow: 0 1px 0 #2a2624, 0 0 18px rgba(255, 60, 40, .9); }
  input[type="range"] { width: 180px; accent-color: #ffb02e; }
  .hint { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); max-width: 300px; padding: 10px 14px; font-size: 14px; color: var(--ink-dim); background: rgba(20, 18, 16, .7); border: 1px solid rgba(230, 225, 216, .12); border-radius: 6px; }
  .hint kbd { font: 700 13px var(--font-num); color: var(--ink); background: #2a2725; padding: 1px 6px; border-radius: 3px; border: 1px solid #44403c; }
  .err { position: fixed; inset: auto 16px 50% 16px; text-align: center; font-size: 16px; color: #ffb4a8; }
  @media (max-width: 700px) { .hint { display: none; } .counter b { font-size: 30px; } input[type="range"] { width: 120px; } }
  @media (prefers-reduced-motion: reduce) { button.key { transition: none; } }

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
// ---------------- physics (inlined from physics.js at build time) ----------------
// HJ-24 reel and transport physics (SI units).
// Renderer-independent so it can be ported 1:1 to the C++ engine.
//
// Model
//  - Tape is wound on two hubs. A pack's outer radius follows from the tape length on it:
//      r(L) = sqrt(rHub^2 + L * thickness / pi)
//  - Tape speed v (m/s, + = toward take-up) is the one state variable of the transport.
//    Each reel turns at w = v / r, so the full reel turns slowly and the empty one fast.
//  - PLAY / RECORD: the capstan and pinch roller hold v at the selected speed with a fast,
//    servo-like response. From a wind, the reels brake first and the pinch roller only
//    engages once the tape is near play speed (the HJ-24's motion sensing).
//  - Winds (F FWD, REW, shuttle, stop from a wind): the reel motors are force-limited, so
//    acceleration = force / effective mass, where the effective mass of the reels seen at the
//    tape is I_supply / r_s^2 + I_takeup / r_t^2. A full reel therefore spools up and brakes
//    more slowly than a nearly empty one.
//  - Lifters hold the tape off the heads at wind speed; LIFT defeats them.
//  - Tape running off a reel stops the transport.
//
// A full reel is 2500 ft. Numbers marked (approx) are plausible values to tune by eye and ear against the real machine.

const TAPE = {
  thickness: 50.8e-6,   // 2.0 mil overall (1.5 mil base + oxide and back coat), typical of 456 / 499 / GP9
  width: 0.0508,        // 2 inch
  density: 1350,        // kg/m^3 (approx)
  hubR: 0.0572,         // 4.5" hub diameter (approx)
  flangeR: 0.1334,      // 10.5" metal reel: 2500 ft of 2" tape on a 4.5" hub fills it
};

// Transport feel, shared by every tape machine in the app: the smooth, servo-controlled transport of the
// Studer A827. Jerk-limited S-curve reel ramps with a long, gentle landing; soft capstan servo.
//  jerk     how fast acceleration itself may change (m/s^3)
//  landing  speed band (m/s) over which the reel servos ease off before reaching the target speed
//  pinchTau time constant (s) of the pinch roller swinging in or out
const MACHINE = {
  name: 'Smooth servo transport',
  emptyReelInertia: 0.0065, // kg m^2, aluminium 10.5" reel for 2" tape (approx)
  windSpeed: 13.0,          // m/s (~512 ips), 30 % faster winds (approx)
  windForce: 62,            // N, servo-controlled reel motors (approx)
  brakeForce: 70,           // N, electronic braking (approx)
  jerk: 12,                 // m/s^3, gentle S-curve ramps (approx)
  landing: 2.4,             // m/s
  capstanTau: 0.2,          // s, capstan servo time constant (approx)
  capstanSlew: 3.5,         // m/s^2
  pinchTau: 0.14,           // s
  pinchEngageWindow: 0.04,  // m/s, pinch roller engages within this of play speed
  lifterSpeed: 1.6,         // m/s, lifters come in above this speed
  locateDecel: 2.2,         // m/s^2, braking profile the autolocator follows into a cue point (approx)
  locateGain: 1.6,          // 1/s, final creep onto the cue point (keeps the reel servo from hunting)
  locateWindow: 0.008,      // m, close enough to the cue point to stop (about 1/3 inch, ~10 ms at 30 IPS)
};

const IPS = 0.0254; // m/s per inch-per-second
const FT = 0.3048;
const ROLL_FT = 2500; // feet of tape on a full reel
const SPEEDS_IPS = [7.5, 15, 30];
const VARI_RANGE = 0.2;  // vari-speed range: ±20 % (about ±3 semitones)

const packRadius = (len, tape = TAPE) => Math.sqrt(tape.hubR * tape.hubR + Math.max(0, len) * tape.thickness / Math.PI);
const packMass = (len, tape = TAPE) => Math.max(0, len) * tape.thickness * tape.width * tape.density;
const reelInertia = (len, tape = TAPE, m = MACHINE) => {
  const r = packRadius(len, tape);
  return m.emptyReelInertia + 0.5 * packMass(len, tape) * (r * r + tape.hubR * tape.hubR);
};
const capacity = (tape = TAPE) => Math.PI * (tape.flangeR * tape.flangeR - tape.hubR * tape.hubR) / tape.thickness;

class Transport {
  constructor({ totalLength = ROLL_FT * FT, onTakeup = 0, speedIPS = 30, tape = TAPE, machine = MACHINE } = {}) {
    this.tape = tape; this.m = machine;
    this.acc = 0;                 // current reel-motor acceleration (m/s^2), jerk limited
    this.total = Math.min(totalLength, capacity(tape));
    this.take = Math.min(Math.max(onTakeup, 0), this.total);
    this.v = 0;
    this.mode = 'stop';           // stop | play | rec | rplay | ff | rew | shuttle | locate
    this.locTarget = 0;           // tape position (m on the take-up) the autolocator is heading for
    this.locThen = 'stop';        // mode to enter on arrival (stop, or play for auto-play)
    this.speedIPS = speedIPS;     // 7.5 | 15 | 30
    this.varispeed = 0;           // fraction, -VARI_RANGE..+VARI_RANGE (0 = off)
    this.shuttle = 0;             // -1 .. 1
    this.liftDefeat = false;
    this.pinch = 0;               // 0 = retracted, 1 = engaged (smoothed for animation)
    this.lift = 0;                // 0 = tape on heads, 1 = lifted (smoothed)
    this.angleS = 0; this.angleT = 0;
    this.zero = this.take;        // counter zero point (tape position)
    this.endOfTape = false;
  }
  get supply() { return this.total - this.take; }
  get rS() { return packRadius(this.supply, this.tape); }
  get rT() { return packRadius(this.take, this.tape); }
  get wS() { return this.v / this.rS; }      // rad/s (supply pays out when v > 0)
  get wT() { return this.v / this.rT; }
  get nominalSpeed() { return this.speedIPS * IPS; }
  get playSpeed() { return this.nominalSpeed * (1 + this.varispeed); }
  get semitones() { return 12 * Math.log2(1 + this.varispeed); }   // pitch shift heard from vari-speed
  get counter() { return (this.take - this.zero) / this.nominalSpeed; } // tape time at the selected speed (vari-speed does not change it)
  get playingMode() { return this.mode === 'play' || this.mode === 'rec' || this.mode === 'rplay'; }   // capstan modes
  get capstanDriving() { return this.playingMode && this.pinch > 0.98; }

  command(mode) {
    if (mode === 'rec' && this.mode !== 'play' && this.mode !== 'rec') mode = 'rec'; // REC from stop = PLAY + REC
    this.mode = mode;
    if (mode !== 'stop') this.endOfTape = false;
  }
  setSpeed(ips) { if (SPEEDS_IPS.includes(ips)) this.speedIPS = ips; }
  setVarispeed(f) { this.varispeed = Math.max(-VARI_RANGE, Math.min(VARI_RANGE, f)); }
  setShuttle(x) { this.shuttle = Math.max(-1, Math.min(1, x)); if (x !== 0) this.mode = 'shuttle'; }
  locate(pos) { this.take = Math.max(0, Math.min(this.total, pos)); this.v = 0; this.mode = 'stop'; }   // load the reel at a position (no motion)
  // autolocator: wind to a tape position under servo control, then stop (or play)
  locateTo(pos, then = 'stop') { this.locTarget = Math.max(0, Math.min(this.total, pos)); this.locThen = then; this.mode = 'locate'; this.endOfTape = false; }
  get counterToTake() { return (sec) => this.zero + sec * this.nominalSpeed; }

  targetSpeed() {
    switch (this.mode) {
      case 'play': case 'rec': return this.playSpeed;
      case 'rplay': return -this.playSpeed;   // reverse play: the capstan pulls the tape back toward the supply reel
      case 'ff': return this.m.windSpeed;
      case 'rew': return -this.m.windSpeed;
      case 'shuttle': return this.shuttle * this.m.windSpeed;
      case 'locate': { const d = this.locTarget - this.take; return Math.sign(d) * Math.min(this.m.windSpeed, Math.sqrt(2 * (this.m.locateDecel ?? 2.2) * Math.abs(d)), (this.m.locateGain ?? 1.6) * Math.abs(d)); }   // braking curve, then an exponential creep onto the cue
      default: return 0;
    }
  }

  effectiveMass() {
    const rs = this.rS, rt = this.rT;
    return reelInertia(this.supply, this.tape, this.m) / (rs * rs) + reelInertia(this.take, this.tape, this.m) / (rt * rt);
  }

  // advance by dt seconds (call with small steps, e.g. 1 ms)
  step(dt) {
    const target = this.targetSpeed();
    const playing = this.playingMode;
    const playTarget = this.mode === 'rplay' ? -this.playSpeed : this.playSpeed;
    const nearPlay = Math.abs(this.v - playTarget) < this.m.pinchEngageWindow;
    const pinchWanted = playing && (this.pinch > 0.5 || nearPlay);
    this.pinch += ((pinchWanted ? 1 : 0) - this.pinch) * Math.min(1, dt / (this.m.pinchTau ?? 0.06));

    if (playing && this.pinch > 0.5) {
      // capstan servo: first-order approach to play speed, slew limited
      const dv = (target - this.v) * Math.min(1, dt / this.m.capstanTau);
      const lim = this.m.capstanSlew * dt;
      this.v += Math.max(-lim, Math.min(lim, dv));
      this.acc = 0;
    } else {
      // reel motors: force limited; braking when the speed magnitude must fall
      const goal = playing ? playTarget : target;
      const diff = goal - this.v;
      const braking = Math.abs(goal) < Math.abs(this.v) || Math.sign(goal) !== Math.sign(this.v);
      const F = braking ? this.m.brakeForce : this.m.windForce;
      const aMax = F / this.effectiveMass();
      // soft landing: ease off within the machine's landing band so the reels settle instead of snapping
      const land = this.m.landing ?? 0.4;
      const jerk = this.m.jerk ?? 400;
      // never carry more acceleration than can be shed (at the jerk limit) before reaching the target
      const aDes = Math.sign(diff) * Math.min(aMax * Math.min(1, Math.abs(diff) / land + 0.08), Math.max(2 * jerk * dt, Math.sqrt(2 * jerk * Math.abs(diff)) - 1.5 * jerk * dt));   // floor keeps it creeping in to lock-on
      // jerk limit: acceleration itself changes no faster than the machine allows (S-curve ramps)
      const dj = jerk * dt;
      this.acc += Math.max(-dj, Math.min(dj, aDes - this.acc));
      const dv = this.acc * dt;
      const settled = Math.abs(diff) < 3e-4 && Math.abs(this.acc) <= 2 * dj;   // within a hair of the target: lock on
      if (settled || (diff >= 0 && dv >= diff) || (diff <= 0 && dv <= diff)) { this.v = goal; this.acc = 0; }
      else this.v += dv;
    }

    // autolocator arrival
    if (this.mode === 'locate' && Math.abs(this.locTarget - this.take) < (this.m.locateWindow ?? 0.004) && Math.abs(this.v) < 0.05) { this.v = 0; this.acc = 0; this.mode = this.locThen; }

    // lifters
    const liftWanted = !this.liftDefeat && Math.abs(this.v) > this.m.lifterSpeed && !this.capstanDriving;
    this.lift += ((liftWanted ? 1 : 0) - this.lift) * Math.min(1, dt / 0.08);

    // move tape
    const rs = this.rS, rt = this.rT;
    this.take += this.v * dt;
    this.angleS += (this.v / rs) * dt;
    this.angleT += (this.v / rt) * dt;
    if ((this.take >= this.total && this.v > 0) || (this.take <= 0 && this.v < 0)) {   // ran off a reel while moving toward it
      this.take = Math.max(0, Math.min(this.total, this.take));
      this.v = 0; this.mode = 'stop'; this.endOfTape = true;
    }
  }

  // advance real time with fixed substeps
  advance(seconds, sub = 0.001) {
    let t = seconds;
    while (t > 1e-9) { const h = Math.min(sub, t); this.step(h); t -= h; }
  }
}


// ---------------- renderer ----------------
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<p class="err">This browser could not start WebGL, so the 3D deck cannot be shown.</p>');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0c0b);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.42;

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 1, 1000);
const view = { az: 0, el: 0.86, dist: 124, target: new THREE.Vector3(0, 3, 2) };
function placeCamera() {
  const { az, el, dist, target } = view;
  camera.position.set(target.x + dist * Math.sin(az) * Math.cos(el), target.y + dist * Math.sin(el), target.z + dist * Math.cos(az) * Math.cos(el));
  camera.lookAt(target);
}
placeCamera();

// lights: soft key from the front-left above (control-room ceiling), cool fill, warm rim
const key = new THREE.DirectionalLight(0xfff1dc, 1.9);
key.position.set(-40, 90, 60); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -60; key.shadow.camera.right = 60; key.shadow.camera.top = 50; key.shadow.camera.bottom = -50; key.shadow.camera.near = 20; key.shadow.camera.far = 220; key.shadow.radius = 6; key.shadow.bias = -0.0004;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x2a2018, 0.22));
const rim = new THREE.DirectionalLight(0xffc89a, 0.6); rim.position.set(50, 40, -60); scene.add(rim);
const LIGHT_PHI = Math.atan2(-(key.position.z), key.position.x); // light direction in reel uv space (uv.y = -z)

// ---------- helpers ----------
const CM = 100; // metres -> cm
function canvasTex(w, h, draw, repeat = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
const blackPlastic = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.38, metalness: 0.0 });

// Inside the console page this view mirrors the console's transport, so the console reels, the autolocator and this
// view are one machine: the console posts its state every frame ('as-state') and this page sends its key presses back
// ('as-cmd'). Standalone (no console), it runs its own transport.
const tr = new Transport({ totalLength: ROLL_FT * FT, onTakeup: 0, speedIPS: 30 });
let shared = false;
const STATE_KEYS = ['take', 'total', 'v', 'acc', 'mode', 'speedIPS', 'varispeed', 'shuttle', 'liftDefeat', 'pinch', 'lift', 'angleS', 'angleT', 'zero', 'endOfTape', 'locTarget'];
if (window.parent !== window) {
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.as !== 'state') return;
    if (!shared) {   // first state from the console: from now on key presses go to the console's transport
      shared = true;
      for (const fn of ['command', 'setSpeed', 'setVarispeed', 'setShuttle', 'locate', 'setLift', 'setZero']) tr[fn] = (...args) => window.parent.postMessage({ as: 'cmd', fn, args }, '*');
    }
    for (const k of STATE_KEYS) tr[k] = d.s[k];
  });
  window.parent.postMessage({ as: 'hello' }, '*');
}
tr.setLift ??= (on) => { tr.liftDefeat = on; };
tr.setZero ??= (z) => { tr.zero = z; };
let blurOn = true;
const $ = (id) => document.getElementById(id);
const keysUI = { rew: $('k-rew'), ff: $('k-ff'), stop: $('k-stop'), rplay: $('k-rplay'), play: $('k-play'), rec: $('k-rec') };
function setMode(m) { if (m !== 'shuttle') $('shuttle').value = 0; tr.command(m); }
$('k-rew').onclick = () => setMode('rew'); $('k-ff').onclick = () => setMode('ff'); $('k-stop').onclick = () => setMode('stop');
$('k-rplay').onclick = () => setMode('rplay'); $('k-play').onclick = () => setMode('play'); $('k-rec').onclick = () => setMode('rec');
$('k-lift').onclick = () => tr.setLift(!tr.liftDefeat);
$('k-7').onclick = () => tr.setSpeed(7.5); $('k-15').onclick = () => tr.setSpeed(15); $('k-30').onclick = () => tr.setSpeed(30);
let variOn = tr.varispeed !== 0;
const applyVari = () => { const pct = Number($('vari').value); tr.setVarispeed(variOn ? pct / 100 : 0); $('vari-out').textContent = variOn ? `${pct >= 0 ? '+' : ''}${pct.toFixed(1)} % · ${tr.semitones >= 0 ? '+' : ''}${tr.semitones.toFixed(2)} st` : 'off'; };
$('k-vari').onclick = () => { variOn = !variOn; applyVari(); };
$('vari').oninput = () => { if (!variOn) variOn = true; applyVari(); };
applyVari();
$('shuttle').oninput = (e) => { const v = Number(e.target.value) / 100; if (v === 0) tr.command('stop'); else tr.setShuttle(v * Math.abs(v)); };
$('shuttle').onchange = (e) => { if (Number(e.target.value) === 0) tr.command('stop'); };
const load = (frac) => { tr.locate(tr.total * frac); tr.setZero(0); };
$('k-head').onclick = () => load(0); $('k-mid').onclick = () => load(0.5); $('k-tail').onclick = () => load(0.97);
$('k-blur').onclick = () => { blurOn = !blurOn; };
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); setMode(tr.playingMode ? 'stop' : 'play'); }
  else if (k === 'p') setMode(tr.mode === 'rplay' ? 'stop' : 'rplay');
  else if (k === 'arrowleft') setMode('rew'); else if (k === 'arrowright') setMode('ff');
  else if (k === 's') setMode('stop'); else if (k === 'r') setMode('rec'); else if (k === 'b') blurOn = !blurOn;
});
// orbit / zoom
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, az: view.az, el: view.el }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', (e) => { if (!drag) return; view.az = Math.max(-0.7, Math.min(0.7, drag.az - (e.clientX - drag.x) * 0.004)); view.el = Math.max(0.3, Math.min(1.35, drag.el + (e.clientY - drag.y) * 0.004)); placeCamera(); });
renderer.domElement.addEventListener('pointerup', () => { drag = null; });
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); view.dist = Math.max(45, Math.min(190, view.dist * Math.exp(e.deltaY * 0.001))); placeCamera(); }, { passive: false });
window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); });

const fmtTime = (s) => { const neg = s < 0; s = Math.abs(s); const m = Math.floor(s / 60), r = s - m * 60; return (neg ? '-' : '') + String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0'); };
let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!shared) tr.advance(dt);   // when mirroring the console, the console steps the transport
  fpsAcc += dt; fpsN++; if (now - fpsT > 500) { $('fps').textContent = `${Math.round(fpsN / fpsAcc)} fps`; fpsAcc = 0; fpsN = 0; fpsT = now; }

  const rS = tr.rS * CM * REEL_SCALE, rT = tr.rT * CM * REEL_SCALE;
  const path = tapePath(rS, rT, tr.lift, 1 - tr.pinch);
  writeTape(path.pts, (tr.take * CM) / 18);
  // reel direction from where the tape meets each pack; screen-CCW is positive in reel uv space
  const dirS = -Math.sign(cross2(sub(path.first, [P.supply.x, P.supply.z]), path.firstDir)) || 1;
  const dirT = -Math.sign(cross2(sub(path.last, [P.takeup.x, P.takeup.z]), path.lastDir)) || 1;
  const shutter = blurOn ? 0.5 * Math.max(dt, 1 / 120) : 0;
  for (const [reel, ang, w, r, dir] of [[reelS, tr.angleS, tr.wS, rS, dirS], [reelT, tr.angleT, tr.wT, rT, dirT]]) {
    const a = dir * ang;
    reel.fm.userData.u.uAngle.value = a;
    reel.fm.userData.u.uBlur.value = Math.min(Math.PI * 2, Math.abs(w) * shutter);
    reel.knob.rotation.y = a;
    reel.shaderAngle = a;
    reel.pack.scale.set(r, 1, r);
    // a hint of flange run-out, as on a real reel
    reel.g.rotation.x = 0.0016 * Math.sin(a); reel.g.rotation.z = 0.0016 * Math.cos(a);
  }
  // pinch roller swings in when the capstan drives
  const out = 1 - tr.pinch;
  pinchG.position.set(P.pinch.x + 1.0 * out, 0, P.pinch.z + 1.6 * out);
  pinchRoller.rotation.y = tr.capstanDriving ? (-tr.take * CM / P.pinch.r) : pinchRoller.rotation.y;
  pins.forEach((m) => { m.position.z = pinZ(tr.lift); });
  // strip lights + HTML keys
  const m = tr.mode;
  for (const [k, mat] of Object.entries(stripKeys)) mat.emissiveIntensity = (k === m || (k === 'play' && m === 'rec') || (k === 'lift' && tr.liftDefeat)) ? 0.9 : 0.0;
  for (const [k, el] of Object.entries(keysUI)) el.setAttribute('aria-pressed', String(k === m || (k === 'play' && m === 'rec')));
  $('k-lift').setAttribute('aria-pressed', String(tr.liftDefeat));
  $('k-7').setAttribute('aria-pressed', String(tr.speedIPS === 7.5)); $('k-vari').setAttribute('aria-pressed', String(variOn));
  $('k-15').setAttribute('aria-pressed', String(tr.speedIPS === 15)); $('k-30').setAttribute('aria-pressed', String(tr.speedIPS === 30));
  $('k-blur').setAttribute('aria-pressed', String(blurOn));
  // readouts
  $('ctr').textContent = fmtTime(tr.counter);
  const st = $('st'); st.textContent = tr.endOfTape ? 'END OF TAPE' : ({ stop: 'STOP', play: 'PLAY', rec: 'RECORD', rplay: 'REVERSE PLAY', ff: 'F FWD', rew: 'REWIND', shuttle: 'SHUTTLE', locate: 'LOCATE' })[m];
  st.className = 'state' + (m === 'rec' ? ' rec' : m !== 'stop' ? ' on' : '');
  $('v').textContent = `${(tr.v / IPS).toFixed(1)} ips`;
  $('vs').textContent = tr.varispeed ? `${(tr.varispeed * 100).toFixed(1)} % · ${tr.semitones.toFixed(2)} st` : 'off';
  $('rs').textContent = `${Math.round(Math.abs(tr.wS) * 60 / (2 * Math.PI))} rpm`;
  $('rt').textContent = `${Math.round(Math.abs(tr.wT) * 60 / (2 * Math.PI))} rpm`;
  $('left').textContent = `${Math.round(tr.supply / FT)} ft`;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__jh24 = { tr, setMode, view, placeCamera, reels: [reelS, reelT] };
</script>
